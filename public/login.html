<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texo as a Service — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif}
body{
  background:#0f1117;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

/* Background subtle grid */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(240,240,64,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(240,240,64,.04) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
}

.card{
  background:#1a1a2e;
  border:1.5px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:48px 44px;
  width:100%;max-width:400px;
  text-align:center;
  position:relative;
  z-index:1;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}

.logo{
  font-size:26px;font-weight:800;letter-spacing:.01em;color:#fff;
  margin-bottom:6px;
}
.logo span{color:#f0f040;font-weight:300}

.tagline{
  font-size:13px;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:40px;
}

.divider{
  width:32px;height:2px;background:#f0f040;opacity:.6;
  margin:0 auto 36px;
}

.welcome{
  font-size:22px;font-weight:700;color:#fff;
  margin-bottom:8px;
  line-height:1.3;
}
.subtitle{
  font-size:14px;color:rgba(255,255,255,.45);
  margin-bottom:36px;line-height:1.6;
}

.btn-google{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:14px 24px;
  background:#fff;color:#1a1a1a;
  border:none;border-radius:8px;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;text-decoration:none;
  transition:all .15s ease;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.btn-google:hover{
  background:#f4f4f4;
  box-shadow:0 4px 16px rgba(0,0,0,.35);
  transform:translateY(-1px);
}
.btn-google:active{transform:translateY(0);box-shadow:0 2px 8px rgba(0,0,0,.25)}

.btn-google svg{flex-shrink:0}

.error-msg{
  margin-top:20px;
  padding:10px 14px;
  background:rgba(212,43,79,.15);
  border:1px solid rgba(212,43,79,.3);
  border-radius:6px;
  font-size:13px;color:#f87171;
  display:none;
}
.error-msg.show{display:block}

.footer-note{
  margin-top:32px;
  font-size:12px;color:rgba(255,255,255,.2);
  line-height:1.6;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">Texo <span>as a Service</span></div>
  <div class="divider"></div>

  <div class="welcome">Bienvenido</div>
  <div class="subtitle">Iniciá sesión con tu cuenta Google<br>para acceder a la plataforma.</div>

  <a href="/auth/google" class="btn-google">
    <!-- Google logo SVG -->
    <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      <path fill="none" d="M0 0h48v48H0z"/>
    </svg>
    Continuar con Google
  </a>

  <div id="errMsg" class="error-msg"></div>

</div>

<script>
  const params = new URLSearchParams(location.search);
  const err = params.get('error');
  if (err) {
    const el = document.getElementById('errMsg');
    el.textContent = err === 'auth_failed'
      ? 'Error al autenticar con Google. Intentá nuevamente.'
      : 'Acceso denegado. Contactá al administrador.';
    el.classList.add('show');
  }
  // Pass next param to /auth/google
  const next = params.get('next');
  if (next) {
    const btn = document.querySelector('.btn-google');
    btn.href = '/auth/google?next=' + encodeURIComponent(next);
  }
</script>

<div style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:16px;font-family:'Inter',sans-serif;font-size:12px;color:rgba(255,255,255,.2);">
  Danilo Sosa | Texo Sistemas
</div>
</body>
</html>
