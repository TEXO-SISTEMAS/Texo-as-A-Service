version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_data_chat_db
    environment:
      POSTGRES_DB: ai_data_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ai_data_chat_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobreescribe el DATABASE_URL para que use el nombre del servicio, no localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_data_chat
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ai_data_chat_frontend
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
